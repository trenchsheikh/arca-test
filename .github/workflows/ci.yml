name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @arca/shared typecheck
      - run: pnpm --filter @arca/db typecheck
      - run: pnpm --filter @arca/ws typecheck
      - run: pnpm --filter @arca/workers typecheck
      - run: pnpm --filter @arca/web typecheck

  foundry-test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge tests
        working-directory: packages/contracts-evm
        run: forge test -vvv

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arca/web build

      - name: Verify Apollo project page renders
        shell: bash
        run: |
          pnpm --filter @arca/web exec next start -p 3100 > /tmp/arca-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3100/agents/apollo -o /tmp/arca-apollo.html; then break; fi
            sleep 1
          done
          test -s /tmp/arca-apollo.html
          grep -q 'Autonomous prediction agent trading probability dislocations on Polymarket' /tmp/arca-apollo.html
          grep -q 'Upcoming ICO / Deal Terms' /tmp/arca-apollo.html

      - name: Verify Apollo navigation in Chromium
        shell: bash
        run: |
          npm install --prefix /tmp/arca-smoke --no-save playwright@1.55.1
          /tmp/arca-smoke/node_modules/.bin/playwright install chromium
          pnpm --filter @arca/web exec next start -p 3100 > /tmp/arca-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3100/ -o /dev/null; then break; fi
            sleep 1
          done
          node apps/web/scripts/verify-apollo.mjs
